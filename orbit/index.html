<style>
:root[data-theme="paper"]{ --bg:#F7F6F2; --surface:#FDFCF8; --fg:#2A2622; --fg2:#6B6660; --mute:#8C948F; --line:#BEBCB8; --speck:transparent; }
:root[data-theme="ink"]{ --bg:#2A2622; --surface:#34302B; --fg:#F7F6F2; --fg2:#C9C4BC; --mute:#9A938B; --line:rgba(247,246,242,.16); --speck:rgba(247,246,242,.05); }
:root{
  --orange:#E0603C; --green:#5BA572; --yellow:#FBE573; --grey:#B0A89D; --grey2:#8C8479;
  --overdue:var(--orange); --stale:var(--yellow); --moving:var(--green); --scheduled:var(--grey); --blocked:var(--grey2); --clear:var(--grey);
  --chipink:#2A2622;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body)}
body{min-height:100vh;-webkit-font-smoothing:antialiased;background-image:radial-gradient(var(--speck) .5px,transparent .6px);background-size:4px 4px}
.wrap{max-width:1060px;margin:0 auto;padding:30px 24px 64px}
.eyebrow{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--fg2)}
h1{font-family:var(--disp);font-size:34px;font-weight:700;letter-spacing:-.015em;margin:8px 0 4px}
.sub{color:var(--fg2);font-size:14px;max-width:56ch;line-height:1.5}
.scribble{font-family:var(--hand);font-size:23px;color:var(--orange);line-height:1;margin:14px 0 2px;display:inline-flex;align-items:flex-end;gap:8px}
.readout{display:flex;flex-wrap:wrap;gap:26px;margin:22px 0 6px}
.readout .r b{font-family:var(--disp);display:block;font-size:26px;font-weight:700;line-height:1;letter-spacing:-.01em}
.readout .r span{font-size:11.5px;color:var(--fg2);letter-spacing:.02em}
.readout .r.alarm b{color:var(--orange)}
.cap{font-size:11px;color:var(--mute);margin-top:8px}

.stagewrap{position:relative;margin:16px 0 8px;overflow:hidden;min-height:180px}
.stagescaler{position:absolute;top:0;left:50%;transform-origin:top left}
.stage{position:relative;width:900px;height:600px}
.rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:3}
.center .dot{width:20px;height:20px;border-radius:50%;background:var(--orange);margin:0 auto 8px}
.center .lbl{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--fg)}
.node{position:absolute;transform:translate(-50%,-50%);z-index:2;border:0;background:none;cursor:pointer;padding:0;color:inherit;text-align:center;transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .5s}
.node .body{border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:border-color .16s}
.node:hover .body,.node:focus-visible .body{border-color:var(--fg)}
.node:focus-visible{outline:none} .node:focus-visible .name{text-decoration:underline}
.node .n{font-family:var(--disp);font-weight:700;font-size:22px;line-height:1;color:var(--fg)}
.node .n small{font-size:10px;color:var(--fg2);font-weight:500}
.node .name{margin-top:10px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.chip{display:inline-block;font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--chipink);background:var(--sc,var(--grey));border-radius:4px;padding:2px 7px;margin-top:5px}
.pips{display:flex;gap:4px;justify-content:center;margin-top:6px}
.pip{width:6px;height:6px;border-radius:50%;border:.5px solid var(--line)}

.drift{margin-top:6px;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface);padding:16px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;cursor:pointer;transition:border-color .16s}
.drift:hover{border-color:var(--orange)}
.drift .big{font-family:var(--disp);font-size:34px;font-weight:700;color:var(--orange);line-height:1}
.drift .txt{flex:1;min-width:230px}
.drift .txt .t{font-family:var(--disp);font-weight:600;font-size:15px}
.drift .txt .d{color:var(--fg2);font-size:13px;line-height:1.5;margin-top:3px}
.drift .txt .hand{font-family:var(--hand);font-size:19px;color:var(--fg);margin-top:4px}
.drift .go{font-family:var(--disp);font-size:11px;font-weight:600;color:var(--fg2);letter-spacing:.06em}
.drift.clear{border-style:solid;border-color:var(--green)} .drift.clear .big{color:var(--green)}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:11px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;border:.5px solid var(--line)}

.world{display:none}
.back{border:0;background:none;color:var(--fg2);font-family:var(--disp);font-size:12px;font-weight:500;letter-spacing:.04em;cursor:pointer;padding:6px 0;display:inline-flex;gap:8px;align-items:center}
.back:hover{color:var(--fg)}
.whead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:8px 0 2px}
.whead h2{font-family:var(--disp);font-size:28px;font-weight:700;margin:0;letter-spacing:-.015em}
.whead .meta{font-size:12.5px;color:var(--fg2)}
.blink{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--orange);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:5px 10px;transition:border-color .15s}
.blink:hover{border-color:var(--orange)}
.wscribble{font-family:var(--hand);font-size:20px;color:var(--fg2);margin:6px 0 0}
.divide{height:1px;background:var(--line);margin:14px 0 0}
.tlink{color:var(--orange);text-decoration:none;font-family:var(--disp);font-size:10.5px;font-weight:700;margin-left:8px}
.tlink:hover{text-decoration:underline}
.capbox{display:flex;gap:8px;margin:16px 0 2px;width:100%}
.capbox input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--fg);font-family:var(--body);font-size:13.5px;padding:11px 13px}
.capbox input:focus{outline:none;border-color:var(--fg)}
.capbox button{background:var(--orange);border:0;border-radius:9px;color:#fff;font-weight:600;font-family:var(--disp);font-size:13px;padding:0 17px;cursor:pointer}
.capbox button:disabled{opacity:.5;cursor:default}
.capmsg{font-size:11.5px;color:var(--green);margin-top:6px;min-height:14px}
.laneblk{margin-top:24px}
.lanehd{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.lanehd .lc{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--chipink);background:var(--sc);border-radius:4px;padding:3px 9px}
.lanehd .ct{font-family:var(--disp);font-size:12px;color:var(--fg2)}
.lanehd .bar{flex:1;height:1px;background:var(--line)}
.task{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 15px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--lc);border-radius:9px;margin-bottom:8px}
.task .tk{font-size:14px;font-weight:600;line-height:1.35}
.task .nx{color:var(--fg2);font-size:12.5px;line-height:1.45;margin-top:3px}
.task .age{font-size:11px;color:var(--mute);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.task .age .p{color:var(--orange);font-weight:700}
.foot{margin-top:36px;border-top:1px solid var(--line);padding-top:16px;font-size:11px;color:var(--mute);line-height:1.6}
.foot .hand{font-family:var(--hand);font-size:16px;color:var(--fg2)}
@media (max-width:640px){ h1{font-size:26px} }
.mlist{display:none}
.mrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--st);border-radius:9px;padding:14px 15px;margin-bottom:8px;cursor:pointer;text-align:left;color:inherit}
.mrow .mn{font-family:var(--disp);font-size:19px;font-weight:700;min-width:36px}
.mrow .mnm{flex:1;font-size:14px;font-weight:600}
.mrow .mst{font-family:var(--disp);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--chipink);background:var(--sc);border-radius:4px;padding:2px 7px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const CONFIG = {"projectUrl":"https://bask-tau.vercel.app/project/{id}","taskUrl":"https://bask-tau.vercel.app/item/{id}","captureEndpoint":""};
const LANEVAR={overdue:'--overdue',blocked:'--blocked',stale:'--stale',scheduled:'--scheduled',active:'--moving',captured:'--clear',waiting:'--blocked',someday:'--clear',reference:'--clear',other:'--clear'};
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PID={}; DATA.projects.forEach(p=>PID[p.title]=p.id);
function bucket(t){const l=t.lane; if(l==='waiting')return 'blocked'; if(['someday','reference'].includes(l))return 'other'; return l;}
const tasks=DATA.tasks.map(t=>({...t,b:bucket(t)}));
const worlds={}; for(const t of tasks){(worlds[t.world]=worlds[t.world]||[]).push(t);}
const FLOAT='Floating / untriaged';
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function worldStats(name){
  const ts=worlds[name]||[]; const by={}; for(const t of ts){by[t.b]=(by[t.b]||0)+1;}
  const order=['overdue','stale','blocked','scheduled','active','captured','other'];
  let primary='clear',best=0;
  for(const k of order){ if((by[k]||0)>best){best=by[k];primary=k;} }
  const stmap={overdue:['--overdue','overdue'],stale:['--stale','stuck'],blocked:['--blocked','waiting'],scheduled:['--scheduled','scheduled'],active:['--moving','moving'],captured:['--clear','queued'],other:['--clear','—'],clear:['--clear','clear']};
  const [svar,slab]=stmap[primary]||stmap.clear;
  return {open:ts.length,by,primary,svar,slab};
}

const realWorlds=Object.keys(worlds).filter(w=>w!==FLOAT);
const filedOpen=realWorlds.reduce((a,w)=>a+worlds[w].length,0);
const floatN=(worlds[FLOAT]||[]).length;
const overdueN=tasks.filter(t=>t.b==='overdue').length;
const staleN=tasks.filter(t=>t.b==='stale').length;
document.querySelector('.eyebrow').insertAdjacentHTML('beforeend',
  ' &nbsp;·&nbsp; '+new Date(DATA.generated).toLocaleString('en-AU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Australia/Brisbane'})+' AEST');
document.getElementById('readout').innerHTML=[
 ['r',filedOpen,'open in worlds'],['r',floatN,'untriaged'],
 ['r alarm',overdueN,'overdue'],['r',staleN,'stale'],['r',realWorlds.length,'active worlds'],
].map(([c,n,l])=>`<div class="${c}"><b>${n}</b><span>${l}</span></div>`).join('');
document.getElementById('cap').textContent='Read-only snapshot. Filed numbers are exact.'+(floatN>=200?' Untriaged is a floor (bask caps at 200 per pull).':'');

const startWorld=[...realWorlds].map(w=>{const s=worldStats(w);return {w,score:(s.by.overdue||0)*2+(s.by.stale||0)};})
  .sort((a,b)=>b.score-a.score)[0];
if(startWorld && startWorld.score>0){
  document.getElementById('scribble').innerHTML=
   `start with <span style="position:relative;color:var(--fg)">${esc(startWorld.w)}`+
   `<svg width="100%" height="8" viewBox="0 0 120 8" preserveAspectRatio="none" style="position:absolute;left:0;bottom:-6px"><path d="M2 5 C 30 1, 70 8, 118 3" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round"/></svg>`+
   `</span> &nbsp;→`;
} else { document.getElementById('scribble').textContent='robots did the filing. nice and tidy.'; }

function captureBox(world,hostId){
  if(!CONFIG.captureEndpoint) return;
  const host=document.getElementById(hostId);
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="capbox"><input placeholder="Drop a note${world?' into '+esc(world):''}…"><button>Add</button></div><div class="capmsg"></div>`;
  const inp=wrap.querySelector('input'),btn=wrap.querySelector('button'),msg=wrap.querySelector('.capmsg');
  async function fire(){const text=inp.value.trim(); if(!text)return; btn.disabled=true; msg.style.color=cssv('--fg2'); msg.textContent='adding…';
    try{const notes=(world?('→ '+world+'\n'):'')+text+'\n(captured from orbit)';
      const r=await fetch(CONFIG.captureEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:text.slice(0,90),notes})});
      if(!r.ok)throw 0; inp.value=''; msg.style.color=cssv('--green'); msg.textContent='captured to bask ✓';
    }catch(e){msg.style.color=cssv('--orange'); msg.textContent='could not reach bask — try again';} btn.disabled=false;}
  btn.onclick=fire; inp.addEventListener('keydown',e=>{if(e.key==='Enter')fire();}); host.appendChild(wrap);
}
captureBox(null,'orbitcap');

(function(){const d=document.getElementById('drift');
  if(floatN>0){ d.innerHTML=`<div class="big">${floatN}</div><div class="txt"><div class="t">Untriaged drift</div>
    <div class="d">Tasks captured but not yet given a world. Clear these in bask and every number here tells the truth.</div>
    <div class="hand">the bit the robots can't do for you</div></div><div class="go">open &rsaquo;</div>`;
  } else { d.classList.add('clear'); d.innerHTML=`<div class="big">✓</div><div class="txt"><div class="t">Drift cleared</div>
    <div class="d">Every open task lives in a world. The orbit is now a true picture.</div><div class="hand">finally</div></div>`;
    d.style.cursor='default'; }
})();

const stage=document.getElementById('stage');
const nodeWorlds=realWorlds.map(w=>({name:w,...worldStats(w)}));
const inner=nodeWorlds.filter(w=>w.open>=10).sort((a,b)=>b.open-a.open);
const outer=nodeWorlds.filter(w=>w.open<10).sort((a,b)=>b.open-a.open);
const maxOpen=Math.max(...nodeWorlds.map(w=>w.open),1);
const size=o=>Math.round(60+Math.sqrt(o/maxOpen)*72);
function place(list,radius,startDeg){const n=list.length;list.forEach((w,i)=>{const a=(startDeg+i*(360/n))*Math.PI/180;w.x=50+Math.cos(a)*radius;w.y=50+Math.sin(a)*radius;w.d=size(w.open);});}
// single ring when few worlds carry load, else inner/outer split
if(inner.length===0){ place(outer, outer.length<=5?30:36, -90); }
else { place(inner,26,-90); place(outer,42,-62); }
[...inner,...outer].forEach((w,idx)=>{
  const b=document.createElement('button');
  b.className='node'; b.style.left=w.x+'%'; b.style.top=w.y+'%';
  b.style.opacity=0; b.style.transform='translate(-50%,-50%) scale(.92)';
  const pips=['overdue','stale','blocked','scheduled','active'].filter(k=>w.by[k]).slice(0,5)
     .map(k=>`<span class="pip" style="background:${cssv(LANEVAR[k])}"></span>`).join('');
  b.innerHTML=`<div class="body" style="width:${w.d}px;height:${w.d}px"><div class="n">${w.open}<small> open</small></div></div>
    <div class="name">${esc(w.name)}</div><div class="chip" style="--sc:${cssv(w.svar)}">${w.slab}</div><div class="pips">${pips}</div>`;
  b.onclick=()=>openWorld(w.name);
  stage.appendChild(b);
  requestAnimationFrame(()=>setTimeout(()=>{b.style.opacity=1;b.style.transform='translate(-50%,-50%) scale(1)';},70+idx*60));
});
// scale the whole orbit to fit any width (keeps the spatial worlds interactive on mobile)
function fitStage(){
  const wrap=document.getElementById('stagewrap'), scaler=document.getElementById('scaler');
  if(!wrap||!scaler) return;
  const W=900,H=600, s=Math.min(1, wrap.clientWidth/W);
  scaler.style.transform='translateX('+(-W*s/2)+'px) scale('+s+')';
  wrap.style.height=(H*s)+'px';
}
window.addEventListener('resize',fitStage);
if(window.ResizeObserver){ new ResizeObserver(fitStage).observe(document.getElementById('stagewrap')); }
fitStage(); requestAnimationFrame(fitStage);

function ageStr(t){const b=[];
  if(t.b==='overdue')b.push('<span class="p">overdue</span>'); else if(t.priority&&t.priority!=='none')b.push(t.priority);
  if(t.updated_days!=null)b.push(t.updated_days+'d'); if(t.waiting_on)b.push('→ '+esc(t.waiting_on));
  return b.join(' &middot; ');}
function openWorld(name){
  const ts=(worlds[name]||[]).slice();
  document.getElementById('orbit').style.display='none';
  document.getElementById('world').style.display='block';
  document.getElementById('wname').textContent=name;
  const st=worldStats(name);
  document.getElementById('wmeta').innerHTML=`${st.open} open`+(['overdue','stale','blocked'].filter(k=>st.by[k]).length?' &nbsp;·&nbsp; '+['overdue','stale','blocked'].filter(k=>st.by[k]).map(k=>`${st.by[k]} ${k==='blocked'?'waiting':k}`).join(' &nbsp;·&nbsp; '):'');
  const wl=document.getElementById('wlink');
  wl.innerHTML=(CONFIG.projectUrl&&PID[name])?`<a class="blink" href="${CONFIG.projectUrl.replace('{id}',PID[name])}" target="_blank" rel="noopener">open in bask ↗</a>`:'';
  const oldest=ts.filter(t=>t.updated_days!=null).sort((a,b)=>b.updated_days-a.updated_days)[0];
  document.getElementById('wscribble').textContent=(oldest&&oldest.updated_days>=21)?`oldest thing here has sat ${oldest.updated_days} days — maybe today?`:'';
  document.getElementById('wcap').innerHTML=''; captureBox(name==FLOAT?null:name,'wcap');
  const order=['overdue','blocked','stale','scheduled','active','captured','other'];
  const lab={overdue:'Overdue',blocked:'Waiting on someone',stale:'Stale',scheduled:'Scheduled',active:'Moving',captured:'Captured, not started',other:'Other'};
  const host=document.getElementById('lanes'); host.innerHTML='';
  for(const k of order){
    const items=ts.filter(t=>t.b===k); if(!items.length)continue;
    const v=LANEVAR[k]||'--clear';
    const blk=document.createElement('div'); blk.className='laneblk';
    blk.innerHTML=`<div class="lanehd" style="--sc:${cssv(v)}"><span class="lc">${lab[k]}</span><span class="ct">${items.length}</span><span class="bar"></span></div>`+
      items.map(t=>{const tl=(CONFIG.taskUrl)?` <a class="tlink" href="${CONFIG.taskUrl.replace('{id}',t.id)}" target="_blank" rel="noopener">open ↗</a>`:'';
        return `<div class="task" style="--lc:${cssv(v)}"><div><div class="tk">${esc(t.title)}${tl}</div>${t.next?`<div class="nx">${esc(t.next)}</div>`:''}</div><div class="age">${ageStr(t)}</div></div>`;}).join('');
    host.appendChild(blk);
  }
  window.scrollTo(0,0);
}
document.getElementById('back').onclick=()=>{document.getElementById('world').style.display='none';document.getElementById('orbit').style.display='block';};
const dEl=document.getElementById('drift');
dEl.addEventListener('click',()=>{if(floatN>0)openWorld(FLOAT);});
dEl.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&floatN>0){e.preventDefault();openWorld(FLOAT);}});
document.getElementById('foot').innerHTML=`<span class="hand">Janet did the admin.</span><br>my agentic life · orbit · ${tasks.length} open across ${realWorlds.length} worlds${floatN?` + ${floatN} untriaged`:''} · regenerated from bask, producers write back in the next phase.`;
</script>
